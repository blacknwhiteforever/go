<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioPedia | People List</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: #ffffff; color: #111; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #eee; position: sticky; top: 0; background: rgba(255, 255, 255, 0.95); z-index: 100; }
        .nav-left { display: flex; align-items: center; gap: 15px; }
        .back-btn { display: flex; align-items: center; justify-content: center; text-decoration: none; color: #111; transition: transform 0.2s; }
        .back-btn:hover { transform: translateX(-3px); }
        .back-btn svg { width: 24px; height: 24px; stroke: #111; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .logo { font-size: 1.2rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #000; text-decoration: none; }
        
        .menu-icon { cursor: pointer; display: flex; flex-direction: column; gap: 5px; z-index: 101; }
        .menu-icon span { display: block; width: 25px; height: 2px; background-color: #000; }
        .dropdown-menu { position: absolute; top: 70px; right: 20px; background: #fff; border: 1px solid #eee; display: none; flex-direction: column; padding: 20px; gap: 15px; min-width: 200px; z-index: 99; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .dropdown-menu.active { display: flex; }
        .dropdown-menu a { text-decoration: none; color: #333; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.5px; padding: 5px 0; }

        .page-header { text-align: center; padding: 60px 20px; background-color: #000; color: #fff; }
        .page-header h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; }
        .page-header p { color: #888; font-size: 1rem; margin-top: 10px; }

        .search-container { margin-top: 30px; display: flex; justify-content: center; }
        .search-container input { width: 100%; max-width: 500px; padding: 15px 25px; border: none; border-radius: 50px; font-size: 1rem; font-family: 'Montserrat', sans-serif; outline: none; background-color: #222; color: #fff; transition: 0.3s; }
        .search-container input:focus { background-color: #333; box-shadow: 0 0 0 2px #fff; }
        .search-container input::placeholder { color: #888; }

        .container { max-width: 900px; margin: 50px auto; padding: 0 20px; }
        .people-list { display: flex; flex-direction: column; gap: 20px; }
        .person-item { display: flex; align-items: center; gap: 20px; padding: 15px; border: 1px solid #eee; text-decoration: none; color: #111; transition: 0.3s; }
        .person-item:hover { background: #fafafa; transform: translateX(5px); border-left: 4px solid #000; }
        .person-item img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; }
        .person-info h2 { font-size: 1.3rem; font-weight: 600; margin-bottom: 5px; }
        .person-info p { font-size: 0.9rem; color: #666; }

        .ad-space { text-align: center; padding: 30px 0; margin: 40px 0; border-top: 1px solid #eee; border-bottom: 1px solid #eee; color: #ccc; font-size: 0.8rem; text-transform: uppercase; }
        @media (max-width: 768px) { .navbar { padding: 15px 20px; } .page-header h1 { font-size: 1.8rem; } .search-container input { max-width: 90%; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="blogs.html" class="back-btn" title="Go Back">
                <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </a>
            <a href="index.html" class="logo">BlacknWhite</a>
        </div>
        <div class="menu-icon" onclick="toggleMenu()"><span></span><span></span><span></span></div>
        <div class="dropdown-menu" id="navMenu">
            <a href="index.html">Home / Clothing</a>
            <a href="blogs.html">Blogs</a>
            <a href="biopedia.html">BioPedia</a>
        </div>
    </nav>

    <header class="page-header">
        <h1>BioPedia</h1>
        <p>Search and explore global personalities.</p>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search celebrities by name...">
        </div>
    </header>

    <div class="container">
        <div class="people-list" id="peopleList">
            
            <!-- Shanaya Link Updated to shanaya.html -->
            <a href="shanaya.html" class="person-item">
                <img src="https://i.ibb.co.com/4gZLpG7Q/Shanaya-Kapoor-4.jpg" alt="Shanaya Kapoor">
                <div class="person-info"><h2>Shanaya Kapoor</h2><p>Actress • Model</p></div>
            </a>

            <a href="bio.html" class="person-item">
                <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=150&auto=format&fit=crop" alt="Jake P. Fresco">
                <div class="person-info"><h2>Jake P. Fresco</h2><p>Actor • Theater Artist</p></div>
            </a>

            <a href="bio.html" class="person-item">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=150&auto=format&fit=crop" alt="Taylor Swift">
                <div class="person-info"><h2>Taylor Swift</h2><p>Singer • Songwriter</p></div>
            </a>
            
            <a href="ronaldo.html" class="person-item">
                <img src="https://i.ibb.co.com/bRWfGHm1/Ronaldo-The-Legent.jpg" alt="Cristiano Ronaldo">
                <div class="person-info"><h2>Cristiano Ronaldo</h2><p>Footballer</p></div>
            </a>

        </div>
        <div class="ad-space">[ Advertisement Space - 728x90 ]</div>
    </div>

    <script>
        function toggleMenu() { var menu = document.getElementById("navMenu"); if (menu.classList.contains("active")) { menu.classList.remove("active"); } else { menu.classList.add("active"); } }
        document.getElementById('searchInput').addEventListener('keyup', function() {
            let filter = this.value.toLowerCase();
            let items = document.querySelectorAll('.person-item');
            items.forEach(item => {
                let text = item.querySelector('h2').textContent.toLowerCase();
                if (text.includes(filter)) { item.style.display = 'flex'; } else { item.style.display = 'none'; }
            });
        });
    </script>
</body>
</html>
