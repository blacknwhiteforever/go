<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BnW Answers | Tips & Solutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: #fcfcfc; color: #111; line-height: 1.6; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #eee; position: sticky; top: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(5px); z-index: 100; }
        .nav-left { display: flex; align-items: center; gap: 15px; }
        .back-btn { display: flex; align-items: center; justify-content: center; text-decoration: none; color: #111; }
        .back-btn svg { width: 24px; height: 24px; stroke: #111; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .logo { font-size: 1.2rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #000; text-decoration: none; }
        .menu-icon { cursor: pointer; display: flex; flex-direction: column; gap: 5px; z-index: 101; }
        .menu-icon span { display: block; width: 25px; height: 2px; background-color: #000; }
        .dropdown-menu { position: absolute; top: 70px; right: 20px; background: #fff; border: 1px solid #eee; display: none; flex-direction: column; padding: 20px; gap: 15px; min-width: 200px; z-index: 99; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .dropdown-menu.active { display: flex; }
        .dropdown-menu a { text-decoration: none; color: #333; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; padding: 5px 0; font-weight: 600; }

        .page-header { text-align: center; padding: 60px 20px 30px 20px; }
        .page-header h1 { font-size: 2.5rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 10px; }
        .page-header p { color: #666; font-size: 1rem; }

        .controls-container { max-width: 900px; margin: 0 auto 30px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 15px; }
        .search-box input { width: 100%; padding: 15px 20px; border: 1px solid #ddd; border-radius: 50px; font-size: 1rem; font-family: 'Inter', sans-serif; outline: none; background: #fff; transition: 0.3s; }
        .search-box input:focus { border-color: #000; box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }

        .filter-group { display: flex; justify-content: flex-end; }
        .control-select { width: 200px; padding: 12px 20px; border: 1px solid #ddd; border-radius: 50px; font-size: 0.9rem; font-family: 'Inter', sans-serif; font-weight: 500; outline: none; background: #fff; cursor: pointer; }

        .container { max-width: 900px; margin: 0 auto; padding: 0 20px 60px 20px; }
        .blog-list { display: flex; flex-direction: column; gap: 20px; }

        .blog-card { background: #fff; border: 1px solid #eee; padding: 25px; border-radius: 12px; text-decoration: none; color: #111; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; gap: 8px; }
        .blog-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.06); border-color: #ddd; }
        
        .blog-card h2 { font-size: 1.3rem; font-weight: 600; line-height: 1.4; }
        .blog-card p { font-size: 0.95rem; color: #555; }
        
        .meta-info { display: flex; gap: 15px; font-size: 0.8rem; color: #888; margin-top: 5px; }
        .category-tag { background: #f0f0f0; padding: 3px 10px; border-radius: 50px; font-weight: 600; color: #333; }

        @media (max-width: 768px) {
            .navbar { padding: 15px 20px; }
            .page-header h1 { font-size: 2rem; }
            .filter-group { justify-content: stretch; }
            .control-select { width: 100%; }
        }
    </style>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
<link rel="manifest" href="manifest.json">
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="back-btn"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></a>
            <a href="index.html" class="logo">BlacknWhite</a>
        </div>
        <div class="menu-icon" onclick="toggleMenu()"><span></span><span></span><span></span></div>
        <div class="dropdown-menu" id="navMenu">
            <a href="index.html">Home</a>
            <a href="shop.html">BnW Shop</a>
            <a href="photopic.html">PhotoPic</a>
            <a href="biopedia.html">BioPedia</a>
        </div>
    </nav>

    <header class="page-header">
        <h1>BnW Answers</h1>
        <p>Solutions, Tips, and Guides for Everyday Problems.</p>
    </header>

    <div class="controls-container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search for answers (e.g., how to screenshot)...">
        </div>
        <div class="filter-group">
            <select class="control-select" id="categoryFilter">
                <option value="all">All Categories</option>
                <!-- Categories will be populated automatically via JS -->
            </select>
        </div>
    </div>

    <div class="container">
        <div class="blog-list" id="blogList">
            <!-- Cards injected via JS -->
        </div>
    </div>

    <script>
        function toggleMenu() { var menu = document.getElementById("navMenu"); if (menu.classList.contains("active")) { menu.classList.remove("active"); } else { menu.classList.add("active"); } }

        let allAnswers = [];

        // Fetch JSON Data
        fetch('answers.json')
            .then(res => res.json())
            .then(data => {
                allAnswers = data;
                populateCategories(data);
                renderAnswers(data);
            });

        function populateCategories(data) {
            const categories = [...new Set(data.map(item => item.category))];
            const select = document.getElementById("categoryFilter");
            categories.forEach(cat => {
                const option = document.createElement("option");
                option.value = cat;
                option.textContent = cat;
                select.appendChild(option);
            });
        }

        function renderAnswers(data) {
            const container = document.getElementById("blogList");
            container.innerHTML = "";
            
            if(data.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#888;'>No answers found.</p>";
                return;
            }

            data.forEach(item => {
                const card = document.createElement("a");
                card.href = `answer.html?id=${item.id}`;
                card.className = "blog-card";
                card.innerHTML = `
                    <div class="meta-info">
                        <span class="category-tag">${item.category}</span>
                        <span>${item.date}</span>
                    </div>
                    <h2>${item.question}</h2>
                    <p>${item.short_desc}</p>
                `;
                container.appendChild(card);
            });
        }

        function filterData() {
            const term = document.getElementById("searchInput").value.toLowerCase();
            const cat = document.getElementById("categoryFilter").value;

            const filtered = allAnswers.filter(item => {
                const matchSearch = item.question.toLowerCase().includes(term) || item.short_desc.toLowerCase().includes(term);
                const matchCat = cat === "all" || item.category === cat;
                return matchSearch && matchCat;
            });
            renderAnswers(filtered);
        }

        document.getElementById("searchInput").addEventListener("input", filterData);
        document.getElementById("categoryFilter").addEventListener("change", filterData);
    </script>

    <!-- Global Ads Script -->
    <script src="ads.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js");}</script>
</body>
</html>
