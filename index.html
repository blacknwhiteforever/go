        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #eee; position: sticky; top: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(5px); z-index: 100; }

        .dropdown-menu { position: absolute; top: 70px; right: 20px; background: #fff; border: 1px solid #eee; box-shadow: 0 10px 20px rgba(0,0,0,0.05); display: none; flex-direction: column; padding: 20px; gap: 15px; min-width: 200px; z-index: 99; }

        .dropdown-menu a:hover { color: #999; }

        .hero { text-align: center; padding: 60px 20px; background-color: #fafafa; border-bottom: 1px solid #eee; }

        .main-content { flex: 1; }

        .ad-container { text-align: center; margin: 20px auto 40px auto; display: flex; justify-content: center; overflow: hidden; }

        .grid { column-count: 4; column-gap: 20px; }
        .card { background: #fff; text-align: center; break-inside: avoid; margin-bottom: 20px; display: inline-block; width: 100%; border: 1px solid #f0f0f0; transition: transform 0.3s ease; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .card img { width: 100%; height: auto; display: block; }
        
        .card-content { padding: 15px 10px; }
        .btn { display: block; width: 100%; background-color: #000; color: #fff; padding: 12px 0; text-decoration: none; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; border: 1px solid #000; transition: all 0.3s ease; cursor: pointer; }
        .btn:hover { background-color: #fff; color: #000; }

        footer { background: #000; color: #fff; padding: 40px 20px; text-align: center; margin-top: 50px; }
        .footer-links { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .footer-links a { color: #ccc; text-decoration: none; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s; }
        .footer-links a:hover { color: #fff; }
        .footer-text { color: #666; font-size: 0.8rem; }

        @media (max-width: 1024px) { .grid { column-count: 3; } }
        @media (max-width: 768px) {
            .navbar { padding: 15px 20px; }
            .hero { padding: 50px 20px; }
            .hero h1 { font-size: 1.8rem; }
            .hero p { font-size: 0.9rem; }
            .grid { column-count: 2; column-gap: 10px; }
            .card { margin-bottom: 10px; }
