<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlacknWhite | Visual Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            color: #111;
        }
        
        /* Professional Navbar with Menu Icon */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            z-index: 100;
        }
        .logo {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #000;
            text-decoration: none;
        }
        
        /* Menu Icon (Hamburger) */
        .menu-icon {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 101;
        }
        .menu-icon span {
            display: block;
            width: 25px;
            height: 2px;
            background-color: #000;
            transition: 0.3s;
        }

        /* Dropdown Menu */
        .dropdown-menu {
            position: absolute;
            top: 70px;
            right: 20px;
            background: #fff;
            border: 1px solid #eee;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            display: none;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            min-width: 200px;
            z-index: 99;
        }
        .dropdown-menu.active {
            display: flex;
        }
        .dropdown-menu a {
            text-decoration: none;
            color: #333;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: color 0.3s ease;
            padding: 5px 0;
        }
        .dropdown-menu a:hover {
            color: #999;
        }

        /* Hero Section (New Intro) */
        .hero {
            text-align: center;
            padding: 80px 20px;
            background-color: #fafafa;
            border-bottom: 1px solid #eee;
        }
        .hero h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: #111;
        }
        .hero p {
            font-size: 1rem;
            color: #666;
            letter-spacing: 1px;
            font-weight: 300;
        }

        /* Masonry Layout */
        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .grid {
            column-count: 4;
            column-gap: 20px;
        }
        
        /* Product Card */
        .card {
            background: #fff;
            text-align: center;
            break-inside: avoid;
            margin-bottom: 20px;
            display: inline-block;
            width: 100%;
            border: 1px solid #f0f0f0;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .card img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* Button styling */
        .card-content {
            padding: 15px 10px;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #000;
            color: #fff;
            padding: 12px 0;
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            border: 1px solid #000;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #fff;
            color: #000;
        }

        /* Adsterra Banner Space */
        .ad-space {
            text-align: center;
            padding: 30px 0;
            margin: 40px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            color: #ccc;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .grid { column-count: 3; }
        }
        @media (max-width: 768px) {
            .navbar { padding: 15px 20px; }
            .hero { padding: 50px 20px; }
            .hero h2 { font-size: 1.8rem; }
            .hero p { font-size: 0.9rem; }
            .grid { 
                column-count: 2; 
                column-gap: 10px; 
            }
            .card { margin-bottom: 10px; }
            .btn {
                font-size: 0.75rem;
                padding: 10px 0;
            }
            .dropdown-menu {
                top: 60px;
                right: 10px;
            }
        }
    </style>
</head>

    <!-- JavaScript to toggle menu -->
    <script>
        function toggleMenu() {
            var menu = document.getElementById("navMenu");
            if (menu.classList.contains("active")) {
                menu.classList.remove("active");
            } else {
