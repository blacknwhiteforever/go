    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: #ffffff; color: #111; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #eee; position: sticky; top: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(5px); z-index: 100; }
        .nav-left { display: flex; align-items: center; gap: 15px; }
        .back-btn { display: flex; align-items: center; justify-content: center; text-decoration: none; color: #111; }
        .back-btn svg { width: 24px; height: 24px; stroke: #111; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .logo { font-size: 1.2rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #000; text-decoration: none; }
        .menu-icon { cursor: pointer; display: flex; flex-direction: column; gap: 5px; z-index: 101; }
        .menu-icon span { display: block; width: 25px; height: 2px; background-color: #000; }
        .dropdown-menu { position: absolute; top: 70px; right: 20px; background: #fff; border: 1px solid #eee; display: none; flex-direction: column; padding: 20px; gap: 15px; min-width: 200px; z-index: 99; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .dropdown-menu.active { display: flex; }
        .dropdown-menu a { text-decoration: none; color: #333; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.5px; padding: 5px 0; }

        .page-header { text-align: center; padding: 60px 20px; background-color: #fafafa; border-bottom: 1px solid #eee; }
        .page-header h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; font-weight: 600; letter-spacing: 2px; margin-bottom: 10px; }
        .page-header p { color: #666; font-size: 1rem; font-weight: 300; }

        .container { max-width: 1400px; margin: 40px auto; padding: 0 20px; }
        
        .ad-container { text-align: center; margin: 20px auto 40px auto; display: flex; justify-content: center; overflow: hidden; }

        /* Pinterest Masonry Layout */
        .grid { column-count: 4; column-gap: 20px; }
        
        .photo-card { 
            break-inside: avoid; 
            margin-bottom: 20px; 
            display: inline-block; 
            width: 100%; 
            border-radius: 10px; 
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }
        
        .photo-card img { 
            width: 100%; 
            height: auto; 
            display: block; 
            transition: transform 0.3s ease;
        }
        
        .photo-card:hover img {
            transform: scale(1.05);
        }

        .photo-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .photo-card:hover .photo-overlay { opacity: 1; }
        
        .photo-overlay span {
            background: #fff;
            color: #000;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 1024px) { .grid { column-count: 3; } }
        @media (max-width: 768px) {
            .navbar { padding: 15px 20px; }
            .page-header h1 { font-size: 1.8rem; }
            .grid { column-count: 2; column-gap: 10px; }
            .photo-card { margin-bottom: 10px; }
        }
    </style>
</head>
