<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoPic | Premium Visuals</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: #fcfcfc; color: #111; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #eee; position: sticky; top: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); z-index: 100; }
        .nav-left { display: flex; align-items: center; gap: 15px; }
        .back-btn { display: flex; align-items: center; justify-content: center; text-decoration: none; color: #111; }
        .back-btn svg { width: 24px; height: 24px; stroke: #111; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .logo { font-size: 1.2rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #000; text-decoration: none; }
        .menu-icon { cursor: pointer; display: flex; flex-direction: column; gap: 5px; z-index: 101; }
        .menu-icon span { display: block; width: 25px; height: 2px; background-color: #000; }
        .dropdown-menu { position: absolute; top: 70px; right: 20px; background: #fff; border: 1px solid #eee; display: none; flex-direction: column; padding: 20px; gap: 15px; min-width: 200px; z-index: 99; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .dropdown-menu.active { display: flex; }
        .dropdown-menu a { text-decoration: none; color: #333; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1.5px; padding: 5px 0; font-weight: 600; }

        .page-header { text-align: center; padding: 50px 20px 20px 20px; }
        .page-header h1 { font-family: 'Playfair Display', serif; font-size: 2.8rem; font-weight: 600; letter-spacing: 2px; margin-bottom: 10px; }
        .page-header p { color: #777; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }

        .controls-container { max-width: 1200px; margin: 0 auto 30px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 15px; }
        .search-box input { width: 100%; padding: 15px 20px; border: 1px solid #eee; border-radius: 50px; font-size: 0.95rem; font-family: 'Montserrat', sans-serif; outline: none; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.03); transition: 0.3s; }
        .search-box input:focus { box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-color: #000; }

        .filter-group { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
        .control-select { width: 220px; padding: 12px 20px; border: 1px solid #eee; border-radius: 50px; font-size: 0.85rem; font-family: 'Montserrat', sans-serif; font-weight: 600; outline: none; background: #fff; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.03); appearance: none; -webkit-appearance: none; -moz-appearance: none; padding-right: 40px; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 15px center; background-size: 15px; }

        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px 60px 20px; }
        
        /* Ad Container Styles for Scaling */
        .ad-container { width: 100%; display: flex; justify-content: center; overflow: hidden; margin: 20px 0; break-inside: avoid; }
        .ad-wrapper { width: 728px; height: 90px; display: flex; justify-content: center; }
        .ad-wrapper iframe { border: none; overflow: hidden; }

        /* Layouts */
        .grid-pinterest { column-count: 4; column-gap: 20px; }
        .grid-pinterest .photo-card { break-inside: avoid; margin-bottom: 20px; display: inline-block; width: 100%; border-radius: 12px; overflow: hidden; position: relative; cursor: pointer; background: #f0f0f0; }
        
        .grid-masonry { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .grid-masonry .photo-card { border-radius: 12px; overflow: hidden; position: relative; cursor: pointer; height: 350px; background: #f0f0f0; }
        .grid-masonry .photo-card img { height: 100%; object-fit: cover; }
        
        .grid-reels { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .grid-reels .photo-card { width: 100%; max-width: 450px; height: 80vh; border-radius: 20px; overflow: hidden; position: relative; cursor: pointer; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .grid-reels .photo-card img { height: 100%; object-fit: cover; }

        .photo-card img { width: 100%; display: block; transition: transform 0.5s ease; }
        .photo-card:hover img { transform: scale(1.05); }
        .photo-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 40%); opacity: 0; transition: opacity 0.3s ease; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; color: #fff; }
        .photo-card:hover .photo-overlay { opacity: 1; }
        .photo-overlay h3 { font-size: 1.1rem; margin-bottom: 5px; font-weight: 600; }
        .photo-overlay p { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #ddd; }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #fff; padding: 30px 20px; text-align: center; max-width: 400px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border-radius: 12px; }
        .modal-box h2 { font-family: 'Playfair Display', serif; font-size: 1.6rem; margin-bottom: 10px; color: #111; }
        .modal-box p { font-size: 0.95rem; color: #666; margin-bottom: 15px; }
        .countdown-text { font-size: 1.1rem; font-weight: 600; color: #000; margin-top: 15px; }
        .countdown-text span { color: #ff0000; }
        .modal-ad-space { display: flex; justify-content: center; margin: 15px 0; min-height: 250px; }

        /* Responsive */
        @media (max-width: 1024px) { .grid-pinterest { column-count: 3; } }
        @media (max-width: 768px) {
            .navbar { padding: 15px 20px; }
            .page-header h1 { font-size: 2rem; }
            .grid-pinterest { column-count: 2; column-gap: 10px; }
            .grid-pinterest .photo-card { margin-bottom: 10px; }
            .grid-masonry { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .grid-masonry .photo-card { height: 250px; }
            .grid-reels .photo-card { height: 70vh; border-radius: 12px; }
            
            .filter-group { align-items: stretch; width: 100%; }
            .control-select { width: 100%; }
            
            /* Scale Ad on Mobile */
            .ad-wrapper { 
                transform: scale(0.45); 
                transform-origin: top center; 
                height: 40px; /* Compensate for scaled height */
                margin-bottom: -45px; 
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="back-btn"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></a>
            <a href="index.html" class="logo">BlacknWhite</a>
        </div>
        <div class="menu-icon" onclick="toggleMenu()"><span></span><span></span><span></span></div>
        <div class="dropdown-menu" id="navMenu">
            <a href="index.html">Home</a>
            <a href="shop.html">BnW Shop</a>
            <a href="photopic.html">PhotoPic</a>
            <a href="blogs.html">Blogs</a>
        </div>
    </nav>

    <header class="page-header">
        <h1>PhotoPic</h1>
        <p>Premium Visual Inspiration</p>
    </header>

    <div class="controls-container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search visuals by title or tag...">
        </div>
        <div class="filter-group">
            <select class="control-select" id="categoryFilter">
                <option value="all">All Categories</option>
                <option value="fashion">Fashion</option>
                <option value="tech">Tech</option>
                <option value="aesthetic">Aesthetic</option>
            </select>
            <select class="control-select" id="layoutFilter">
                <option value="pinterest">Pinterest Style</option>
                <option value="masonry">Masonry Grid</option>
                <option value="reels">Reels Style</option>
            </select>
        </div>
    </div>

    <div class="container">
        <!-- Top Ad -->
        <div class="ad-container">
            <div class="ad-wrapper">
                <script type="text/javascript">
                  atOptions = { 'key' : 'f96edce5347f04ad69e124af5a3e443a', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };
                </script>
                <script type="text/javascript" src="https://bauval.org/22/f96edce5347f04ad69e124af5a3e443a"></script>
            </div>
        </div>

        <div id="imageGrid" class="grid-pinterest"></div>
        
        <!-- Bottom Ad -->
        <div class="ad-container" style="margin-top: 30px;">
            <div class="ad-wrapper">
                <script type="text/javascript">
                  atOptions = { 'key' : 'f96edce5347f04ad69e124af5a3e443a', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };
                </script>
                <script type="text/javascript" src="https://bauval.org/22/f96edce5347f04ad69e124af5a3e443a"></script>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="adModal">
        <div class="modal-box">
            <h2>Enjoying PhotoPic?</h2>
            <p>Please wait for the ad to finish. The gallery will unlock automatically.</p>
            
            <!-- Direct Adsterra Script for Modal -->
            <div class="modal-ad-space">
                <script type="text/javascript">
                  atOptions = { 'key' : '23d98862449809c04e4c9daf55c3d963', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {} };
                </script>
                <script type="text/javascript" src="https://bauval.org/22/23d98862449809c04e4c9daf55c3d963"></script>
            </div>

            <div class="countdown-text">Unlocking in <span id="timer">10</span> seconds...</div>
        </div>
    </div>

    <script>
        function toggleMenu() { var menu = document.getElementById("navMenu"); if (menu.classList.contains("active")) { menu.classList.remove("active"); } else { menu.classList.add("active"); } }

        const imageData = [
            { id: 1, img: "https://i.ibb.co.com/NgGtthLq/1.jpg", title: "Classic Monochrome", tag: "fashion" },
            { id: 2, img: "https://i.ibb.co.com/Gv9F9M3t/black-dress.jpg", title: "Elegant Black Dress", tag: "fashion" },
            { id: 3, img: "https://i.ibb.co.com/4gZLpG7Q/Shanaya-Kapoor-4.jpg", title: "Bollywood Glamour", tag: "aesthetic" },
            { id: 4, img: "https://i.ibb.co.com/H6fPXjY/Shanaya-Kapoor-3.jpg", title: "Modern Style", tag: "fashion" },
            { id: 5, img: "https://i.ibb.co.com/Q3wwYKnd/Shanaya-Kapoor.jpg", title: "Minimalist Look", tag: "aesthetic" },
            { id: 6, img: "https://i.ibb.co.com/SDYKCdhm/Shanaya-Kapoor-1.jpg", title: "Elegant Pose", tag: "fashion" },
            { id: 7, img: "https://i.ibb.co.com/PsSMj08V/Shanaya-kapoor-2.jpg", title: "Street Style", tag: "fashion" },
            { id: 8, img: "https://i.ibb.co.com/LXv8bbsK/635429828717827232.jpg", title: "Vintage Vibe", tag: "aesthetic" },
            { id: 9, img: "https://i.ibb.co.com/qLmxs65B/image.jpg", title: "Tech Concept", tag: "tech" },
            { id: 10, img: "https://i.ibb.co.com/Fr1wzj0/83a29fcac68c5cec1b4007ecb39c00fa.jpg", title: "Black & White", tag: "aesthetic" },
            { id: 11, img: "https://i.ibb.co.com/vvZfq6hn/3c7ea0a2b0e078542237e3c364fabd82.jpg", title: "Futuristic AI", tag: "tech" }
        ];

        const gridContainer = document.getElementById("imageGrid");
        const searchInput = document.getElementById("searchInput");
        const categoryFilter = document.getElementById("categoryFilter");
        const layoutFilter = document.getElementById("layoutFilter");

        function renderImages(data) {
            gridContainer.innerHTML = "";
            if(data.length === 0) {
                gridContainer.innerHTML = "<p style='text-align:center; width:100%; color:#888; padding: 20px;'>No images found.</p>";
                return;
            }

            data.forEach((item, index) => {
                const card = document.createElement("div");
                card.className = "photo-card";
                card.innerHTML = `
                    <img src="${item.img}" alt="${item.title}" loading="lazy">
                    <div class="photo-overlay">
                        <h3>${item.title}</h3>
                        <p>${item.tag}</p>
                    </div>
                `;
                gridContainer.appendChild(card);

                // Inject Ad every 3 images
                if ((index + 1) % 3 === 0 && index !== data.length - 1) {
                    const adDiv = document.createElement("div");
                    adDiv.className = "ad-container injected-ad";
                    if (gridContainer.classList.contains("grid-pinterest")) {
                        adDiv.style.display = "inline-block";
                        adDiv.style.width = "100%";
                        adDiv.style.marginBottom = "20px";
                    }
                    
                    // Create wrapper for scaling
                    adDiv.innerHTML = `
                        <div class="ad-wrapper" style="width: 100%;">
                            <script type="text/javascript">
                              atOptions = { 'key' : 'f96edce5347f04ad69e124af5a3e443a', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };
                            <\/script>
                            <script type="text/javascript" src="https://bauval.org/22/f96edce5347f04ad69e124af5a3e443a"><\/script>
                        </div>
                    `;
                    
                    // We must use document.write to execute the Adsterra script inside the dynamically injected div
                    const scripts = adDiv.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    gridContainer.appendChild(adDiv);
                }
            });
        }

        function filterData() {
            const searchTerm = searchInput.value.toLowerCase();
            const category = categoryFilter.value;
            const filtered = imageData.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(searchTerm) || item.tag.toLowerCase().includes(searchTerm);
                const matchesCategory = category === "all" || item.tag === category;
                return matchesSearch && matchesCategory;
            });
            renderImages(filtered);
        }

        function switchLayout() {
            const layout = layoutFilter.value;
            gridContainer.className = ""; 
            if (layout === "pinterest") gridContainer.classList.add("grid-pinterest");
            else if (layout === "masonry") gridContainer.classList.add("grid-masonry");
            else if (layout === "reels") gridContainer.classList.add("grid-reels");
            filterData(); 
        }

        searchInput.addEventListener("input", filterData);
        categoryFilter.addEventListener("change", filterData);
        layoutFilter.addEventListener("change", switchLayout);
        renderImages(imageData);

        // --- TIMER LOGIC ---
        let isModalOpen = false;
        
        function showAdModal() {
            if (isModalOpen) return;
            isModalOpen = true;
            
            var modal = document.getElementById("adModal");
            modal.classList.add("active");
            document.body.style.overflow = 'hidden'; 

            let timeLeft = 10;
            let timerElement = document.getElementById("timer");
            timerElement.innerText = timeLeft;

            let countdownInterval = setInterval(function() {
                timeLeft--;
                timerElement.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    modal.classList.remove("active");
                    document.body.style.overflow = 'auto'; 
                    isModalOpen = false;
                }
            }, 1000);
        }

        window.addEventListener('load', () => {
            setTimeout(showAdModal, 5000);
        });

        setInterval(() => {
            if (document.visibilityState === 'visible') {
                showAdModal();
            }
        }, 1200000); // 20 minutes
    </script>
</body>
</html>
